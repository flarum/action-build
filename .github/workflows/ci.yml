name: CI

on: [push, pull_request]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile (tsc)
        run: yarn build

      - name: Check formatting
        run: yarn format-check

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      # A bundled action ships its compiled `dist/`. Rebuild it and fail if the
      # committed output is stale, so the action never runs against outdated code.
      - name: Package
        run: yarn package

      - name: Verify dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'yarn package' and commit the result."
            echo "--- node/ncc ---"; node --version
            git --no-pager diff --stat dist/
            echo "--- index.js diff (excluding the sourcemap) ---"
            git --no-pager diff -- dist/index.js
            exit 1
          fi
